name: P10 - Lanzar comprobacion manual
on:
  push:
    paths:
      - 'docs/solicitar-ejecucion-manual.txt'
permissions:
  actions: write
  contents: read
jobs:
  disparar:
    runs-on: ubuntu-22.04
    steps:
      - name: Iniciar workflow_dispatch con entradas de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run contextos.yml --ref main -f modo=detallado -f generar_informe=true
          echo 'Se ha solicitado una ejecución manual con modo=detallado e informe habilitado.'
